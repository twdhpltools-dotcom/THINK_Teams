<body>

  <!----------------------------------- PRE-LOADER ------------------------------------------------->
  <div id="PreLoader" class="pre-loader fixed top-0 left-0 size-full flex items-center justify-center bg-[var(--light)] z-100">
    <div class="pg-loader flex gap-2 px-4 py-1 border border-solid border-[#e8e8e8] rounded-2xl bg-[#ffffffe6] drop-shadow-xl">

  <!----------------------------------- PRE-LOADER ------------------------------------------------->

  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->
  <div class="h-[80vh] w-full bg-linear-to-b from-[#F4F2F2]/40 to-[var(--light)] relative z-1">

    <button class="go-back-btn absolute top-7 left-7 h-11 w-11 rounded-[50%] bg-[var(--light)] border-none flex items-center justify-center z-2">
      <img src="assets/images/back.png" alt="filter icon" class="scale-40">
    </button>

    <!----- PROFILE-SELETION-VERFICATION ------->
    <div class="size-full flex flex-col items-center justify-center">

      <div class="h-auto w-25 mb-5">
        <img src="assets/images/p-logo.png" alt="brand logo" />
      </div>

      <div class="h-auto w-60 mb-6">
        <img src="assets/images/login-vector.png" alt="Login Vector" />
      </div>


      <div class="h-auto w-full px-8">
        <h5 class="text-[130%] font-medium text-[var(--dark-primary)] min-[576px]:text-[150%] mb-5">Locations</h5>

        <div class="h-auto w-full mb-5">
          <div class="dropdown w-full relative z-1">
            <button class="btn dropdown-toggle h-auto w-full bg-[var(--light)] border border-solid border-[#d1d1d19e] rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)] focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none bg-white text-left flex items-center justify-between" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="DoctorProfileSelect">
              <span>Select Location</span>
              <svg id="DoctorChevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="transition-all duration-300">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <ul class="dropdown-menu w-full absolute top[100%] left-0 z-2 !py-2 px-2 rounded-xl border border-[#d1d1d19e] bg-white overflow-hidden hidden" id="DoctorDropdown">

              <li>
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 !mb-0 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[95%] font-semibold text-[var(--dark-primary)]">
                      Life Fertility Centre
                      <span class="block mt-1 text-[90%] font-medium text-[var(--dark-primary)]/55">
                        Pandua, Malda
                      </span>
                    </p>
                  </div>
                </label>
              </li>

              <li>
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 !mb-0 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[95%] font-semibold text-[var(--dark-primary)]">
                      Bactro Clinical Laboratory
                      <span class="block mt-1 text-[90%] font-medium text-[var(--dark-primary)]/55">
                        Ratepara, Bangaon
                      </span>
                    </p>
                  </div>
                </label>
              </li>

              <li>
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 !mb-0 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[95%] font-semibold text-[var(--dark-primary)]">
                      CCL Diagnostic Laboratory
                      <span class="block mt-1 text-[90%] font-medium text-[var(--dark-primary)]/55">
                        Park Circus, Kolkata
                      </span>
                    </p>
                  </div>
                </label>
              </li>

            </ul>
          </div>
        </div>

        <div class="h-auto w-full text-center">
          <button class="h-auto w-full rounded-md py-3 text-[90%] text-[var(--light)] font-medium bg-[var(--primary)] border-none outline-none shadow-[0_10px_20px_0_#d52e8a33]" onclick="window.location.href='index.html'">
            Continue
          </button>

      </div>

    </div>

  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->

  <!----------------------------------- JS FOR CUSTOM-SELECT START ------------------------------------------------->
  <script>
    const doctorBtn = document.getElementById("DoctorProfileSelect");
    const doctorDropdown = document.getElementById("DoctorDropdown");
    const doctorChevron = document.getElementById("DoctorChevron");

    doctorBtn.addEventListener("click", function (e) {

        e.stopPropagation();

        doctorDropdown.classList.toggle("hidden");

        doctorChevron.classList.toggle("rotate-180");
    });

    document.addEventListener("click", function (e) {

        if (
            !doctorBtn.contains(e.target) &&
            !doctorDropdown.contains(e.target)
        ) {
            doctorDropdown.classList.add("hidden");
            doctorChevron.classList.remove("rotate-180");
        }
    });
  </script>
  <!----------------------------------- JS FOR CUSTOM-SELECT COMPLETED ------------------------------------------------->

  <script src="assets/js/tailwind.js" type="text/javascript"></script>

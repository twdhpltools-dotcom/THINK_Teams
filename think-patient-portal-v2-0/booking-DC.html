<body>

  <!----------------------------------- PRE-LOADER ------------------------------------------------->
  <div id="PreLoader" class="pre-loader fixed top-0 left-0 size-full flex items-center justify-center bg-[var(--light)] z-100">
    <div class="pg-loader flex gap-2 px-4 py-1 border border-solid border-[#e8e8e8] rounded-2xl bg-[#ffffffe6] drop-shadow-xl">
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
    </div>
  </div>
  <!----------------------------------- PRE-LOADER ------------------------------------------------->

  <!----------------------------------- BOOKING SECTION ------------------------------------------------->
  <section class="page h-auto w-full">

    <!----- BOTTOM-ISLAND ------->
    <div class="fixed bottom-0 h-auto w-full py-4 bg-[var(--light)] flex items-center justify-center gap-x-20 rounded-tl-[20px] rounded-tr-[20px] shadow-[0_-10px_25px_0_#00000010] z-101">
      <a href="dashboard.html" class="nav-btn text-center text-[75%] font-medium text-[var(--dark-primary)]/90">
        <i class="bi bi-house-door block text-[170%] mb-[-5px]"></i>
        Home
      </a>
      <a href="index.html" class="nav-btn text-center text-[75%] font-medium text-[var(--dark-primary)]/90 active">
        <i class="bi bi-calendar-check block text-[170%] mb-[-5px]"></i>
        Booking
      </a>
      <a href="profile.html" class="nav-btn text-center text-[75%] font-medium text-[var(--dark-primary])/90">
        <i class="bi bi-person block text-[170%] mb-[-5px]"></i>
        Profile
      </a>
    </div>
    <!----- BOTTOM-ISLAND ------->
    
    <main class="h-auto w-full bg-[var(--light)]">

      <!----- TOP-BAR ------->
      <div class="h-auto w-full fixed top-0 left-0 z-[100] bg-[var(--light)] px-5 py-3 flex items-center justify-between">

        <div class="flex items-center gap-x-2">
          <button class="h-[32px] w-[32px] flex items-center justify-center bg-transparent outline-none border-none cursor-pointer go-back-btn">
            <i class="bi bi-arrow-left text-[130%] leading-none text-[#202020]"></i>
          </button>
          <h1 class="m-0 text-[110%] leading-none font-semibold tracking-[-0.4px] text-[var(--dark)]/70">
            Book Your Consultation
          </h1>
        </div>
        <button class="relative h-[40px] w-[40px] flex items-center justify-center bg-transparent border-none outline-none cursor-pointer" onclick="window.location.href='notfication.html'">
          <i class="bi bi-bell text-[125%] leading-none text-[#64748B]"></i>
          <span class="absolute top-[-2px] right-[-1px] h-[18px] min-w-[18px] px-[5px] rounded-full bg-[#FF174D] flex items-center justify-center text-[75%] leading-none font-semibold text-[var(--light)]">
            1
          </span>
        </button>
        
      </div>
      <!----- TOP-BAR ------->

      <!----- PAGE-CONTENT ------->
      <div class="content h-auto w-full pb-25">

        <div class="h-auto w-full px-5">

          <div class="h-auto w-full pt-5">
            <div class="h-auto w-full flex items-center gap-x-1 mb-2 last:mb-0">
              <input type="tel" class="h-auto w-full bg-[var(--light)] border border-solid border-[#00000010] outline-none rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Alternate Contact Number" />
            </div>
            <div class="h-auto w-full flex items-center gap-x-1 mb-2 last:mb-0">
              <input type="text" class="h-auto w-full bg-[var(--light)] border border-solid border-[#00000010] outline-none rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Reason for Consultation* (e.g., Fever etc.)" />
            </div>
            <div class="h-auto w-full flex items-center gap-x-1 mb-2 last:mb-0">
              <select class="h-auto w-full bg-[var(--light)] border border-solid border-[#00000010] outline-none rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]">
                <option>Choose a Specialty*</option>
                <option>General Medicine</option>
                <option>Rheumatology</option>
                <option>Gynocology</option>
                <option>ENT</option>
                <option>Others</option>
              </select>
            </div>
            <div class="h-auto w-full flex items-center gap-x-1 mb-3 last:mb-0">
              <select class="h-auto w-full bg-[var(--light)] border border-solid border-[#00000010] outline-none rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]">
                <option>Select Doctor*</option>
                <option>Dr. Priya Saha</option>
                <option>Dr. Amit Kumar Das</option>
                <option>Dr. Ranjit Bhattacherjee</option>
                <option>Dr. Swapna Roy</option>
              </select>
            </div>
            <div class="h-auto w-full flex items-center justify-between mb-3 last:mb-0">
              <h6 class="text-[var(--dark)]/60 font-semibold text-[90%]">Schedule</h6>
              <div class="flex items-center gap-x-2">
                <button class="h-6 w-6 flex items-center justify-center rounded-full outline-none border border-[#00000020] bg-[var(--light)] text-[var(--dark)]">
                  <i class="bi bi-chevron-left text-[75%]"></i>
                </button>
                <span class="text-[75%] font-medium text-[var(--dark)]/60">June 2026</span>
                <button class="h-6 w-6 flex items-center justify-center rounded-full outline-none border border-[#00000020] bg-[var(--light)] text-[var(--dark)]">
                  <i class="bi bi-chevron-right text-[75%]"></i>
                </button>
              </div>
            </div>
            <div class="h-auto w-full mb-3 last:mb-0">
              <div class="w-full overflow-x-auto scrollbar-hide">
                <div class="inline-flex items-center min-w-max gap-x-3">
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Sun</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">15</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Mon</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">16</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Tue</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[var(--primary)] text-[110%] font-semibold text-[var(--light)]">17</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Wed</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">18</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Thu</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">19</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Fri</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">20</span>
                  </div>
                  <div class="date-chip flex shrink-0 cursor-pointer px-1 py-2 flex-col items-center justify-center rounded-full border border-[#00000010] bg-[var(--light)] text-[var(--dark)]/50 transition-all duration-300">
                    <span class="mb-[2px] block text-[85%] font-normal text-[var(--dark)]/70">Sat</span>
                    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f3f3f3] text-[110%] font-semibold text-[var(--dark-primary)]/70">21</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="h-auto w-full flex items-center justify-between mb-3 last:mb-0">
              <h6 class="text-[var(--dark)]/60 font-semibold text-[90%]">Today Availability</h6>
              <span class="text-[80%] font-medium text-[var(--dark)]/60">4 Slots</span>
            </div>
            <div class="grid h-auto w-full grid-cols-4 gap-x-3 gap-y-2 mb-5 last:mb-0">
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200">
                04:00 PM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200 selected">
                06:00 PM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200">
                08:00 PM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200">
                10:00 PM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200">
                12:00 AM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200">
                06:00 AM
              </button>
              <button class="chip h-7 flex items-center justify-center rounded-full outline-none border border-[#00000050] px-10 text-center text-[75%] font-medium transition-all duration-200 selected">
                08:00 AM
              </button>
            </div>
            <div class="h-auto w-full flex items-center gap-x-1 mb-2 last:mb-0">
              <input type="file" id="FileUpload" hidden="">
              <button class="h-auto w-full flex items-center justify-center gap-x-2 border border-dashed border-[#00000020] outline-none rounded-[5px] py-2 text-left" onclick="document.getElementById('FileUpload').click()">
                <div class="h-10 w-10 rounded-[50%] bg-[var(--primary)]/5 flex items-center justify-center">
                  <i class="bi bi-cloud-upload text-[160%] text-[var(--primary)]"></i>
                </div>
                <div class="">                  
                  <h6 class="text-[80%] text-[var(--dark-primary)]/90 font-semibold">Upload Prescription (Optional)</h6>
                  <p class="text-[70%] text-[var(--dark)]/50">JPG, PNG or PDF <span class="text-[100%]"><i class="bi bi-dot"></i> Max 5 MB</span></p>
                </div>
              </button>
            </div>
            <div class="h-auto w-full flex items-center gap-x-1 mt-4 mb-2 last:mb-0">
              <button class="h-auto w-full py-[10px] rounded-sm bg-[var(--primary)]/90 border border-solid border-[var(--primary)]/60 outline-none font-semibold text-[90%] text-[var(--light)]" onclick="window.location.href='payment.html'">
                Confirm
              </button>
            </div>
          </div>
        
        </div>
        
      </div>
      <!----- PAGE-CONTENT ------->

    </main>

  </section>

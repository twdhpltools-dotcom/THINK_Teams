  <meta name="title" content="Register | ThinkLab Patient Portal Application | A Trusted Patient Management Software of India" />
  <meta name="description" content="ThinkLab Patient Portal Application | A Trusted Patient Management Software of India" />

  <meta name="googlebot" content="noindex, nofollow" />

  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->
</head>

<body>

  <!----------------------------------- REGISTER SECTION ------------------------------------------------->
  <div class="h-[100vh] w-full bg-linear-to-b from-[#F4F2F2]/40 to-[var(--light)]">

    <button class="go-back-btn absolute top-7 left-7 h-11 w-11 rounded-[50%] bg-[var(--light)] border-none flex items-center justify-center z-2">
      <img src="assets/images/back.png" alt="filter icon" class="scale-40">
    </button>

    <!----- CREATE NEW USER ------->
    <div class="size-full flex flex-col items-center justify-center">

      <div class="h-auto w-25 mb-5">
        <img src="assets/images/p-logo.png" alt="brand logo" />
      </div>

      <div class="h-auto w-60 mb-6">
        <img src="assets/images/login-vector.png" alt="Login Vector" />
      </div>

      <div class="h-auto w-full px-8">
        <h5 class="text-[130%] font-medium text-[var(--dark-primary)] min-[576px]:text-[150%]">Register</h5>
        <p class="text-[75%] text-[var(--dark-primary)]/90 mb-5 min-[576px]:text-[85%]">Create account as a new user.</p>

        <div class="h-auto w-full mb-5">
          <div class="grid grid-cols-1 place-items-center gap-x-3 gap-y-3 mb-3 last:mb-0">
            <div class="h-auto w-full">
                <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <div class="relative flex items-center border-r border-solid border-[#d1d1d19e] px-3 py-2 z-1">
                    <select class="bg-transparent text-[90%] font-medium text-[var(--dark-primary)] outline-none cursor-pointer !shadow-none">
                      <option value="0">Mr.</option>
                      <option value="1">Ms.</option>
                    </select>
                  </div>
                  <input type="text" class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter username *" required />
                </div>
            </div>
          </div>
          <div class="grid grid-cols-2 place-items-center gap-x-3 gap-y-3 mb-3 last:mb-0">
            <div class="h-auto w-full">
                <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <input type="number" class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter age *" required />
                </div>
            </div>
            <div class="h-auto w-full">
                <div class="h-auto w-full overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <select class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]">
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                    <option value="2">Others</option>
                  </select>
                </div>
            </div>
          </div>
          <div class="grid grid-cols-1 place-items-center gap-x-3 gap-y-3 mb-3 last:mb-0">
            <div class="h-auto w-full">
                <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <div class="relative flex items-center border-r border-solid border-[#d1d1d19e] px-3 py-2 z-1">
                    <select class="bg-transparent text-[90%] font-medium text-[var(--dark-primary)] outline-none cursor-pointer !shadow-none !focus:border-none">
                      <option value="+91">+91</option>
                      <option value="+1">+1</option>
                      <option value="+44">+44</option>
                      <option value="+61">+61</option>
                      <option value="+971">+971</option>
                    </select>
                  </div>
                  <input type="tel" class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter mobile number" required />
                </div>
            </div>
          </div>
          <div class="grid grid-cols-1 place-items-center gap-x-3 gap-y-3 mb-3 last:mb-0">
            <div class="h-auto w-full">
                <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <input type="email" class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter email address *" required />
                </div>
            </div>
          </div>
          <div class="grid grid-cols-1 place-items-center gap-x-3 gap-y-3 mb-3 last:mb-0">
            <div class="h-auto w-full">
                <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
                  <textarea class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-4 py-2 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter address *" required></textarea>
                </div>
            </div>
          </div>
        </div>

        <div class="h-auto w-full text-center mb-5">
          <button class="h-auto w-full rounded-md py-3 text-[90%] text-[var(--light)] font-medium bg-[var(--primary)] border-none outline-none shadow-[0_10px_20px_0_#d52e8a33]" onclick="window.location.href='index.html'">
            Continue
          </button>       
        </div>
      </div>

    </div>
    <!----- CREATE NEW USER ------->

  </div>
  <!----------------------------------- REGISTER SECTION ------------------------------------------------->

  <script src="assets/js/tailwind.js" type="text/javascript"></script>

  <script src="assets/js/page-back.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR PG-BACK-FUCNTIONALITY FILES COMPLETE ---------------------------------------->

  <!------------------------------------ JS FOR PRE-LOADER FILES START -------------------------------------------->
  <script src="assets/js/pre-loader.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR PRE-LOADER FILES COMPLETE ---------------------------------------->

</body>
</html>

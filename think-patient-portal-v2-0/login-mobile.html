<body>

  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->
  <div class="h-screen w-full bg-linear-to-b from-[#F4F2F2]/40 to-[var(--light)]">

    <!----- MOBILE-NUMBER-VERFICATION ------->
    <div class="size-full flex flex-col items-center justify-center fixed top-0 left-0">

      <div class="h-auto w-25 mb-5">
        <img src="assets/images/p-logo.png" alt="brand logo" />
      </div>

      <div class="h-auto w-70 mb-9">
        <img src="assets/images/login-vector.png" alt="Login Vector" />
      </div>

      <div class="h-auto w-full px-8">
        <h5 class="text-[130%] font-medium text-[var(--dark-primary)] min-[576px]:text-[150%] mb-1">Sign In</h5>
        <p class="text-[75%] text-[var(--dark-primary)]/90 mb-6 min-[576px]:text-[85%]">Enter your mobile number to sign in securely.</p>

        <div class="h-auto w-full mb-5">
          <label class="inline-block font-medium">Phone Number</label>
          <div class="h-auto w-full flex items-center overflow-hidden rounded-[5px] border border-solid border-[#d1d1d19e] bg-[var(--light)] hover:border-[var(--primary)]">
             <div class="relative flex items-center border-r border-solid border-[#d1d1d19e] px-3 py-3 z-1">
              <div class="w-[25px] me-1">
                <img src="assets/images/India-map.png" alt="Country">
              </div>
              <select class="bg-transparent text-[90%] font-medium text-[var(--dark-primary)] outline-none cursor-pointer !shadow-none">
                <option value="+91">+91</option>
                <option value="+1">+1</option>
                <option value="+44">+44</option>
                <option value="+61">+61</option>
                <option value="+971">+971</option>
              </select>
              <i class="bi bi-person-fill pointer-events-none absolute right-3 text-[65%] text-[var(--dark-primary)]/60 z-2"></i>
            </div>
            <input type="tel" class="h-auto w-full bg-[var(--light)] outline-none rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/90 font-medium hover:border-[var(--primary)]]" placeholder="Enter mobile number" />
          </div>
        </div>

        <div class="h-auto w-full text-center">
          <button class="h-auto w-full rounded-md py-3 text-[90%] text-[var(--light)] font-medium bg-[var(--primary)] border-none outline-none shadow-[0_10px_20px_0_#d52e8a33]" onclick="window.location.href='login-otp.html'">
            Continue
          </button>       
        </div>

        <div class="h-auto w-full border border-solid border-[#00000010] relative z-1 mt-8 mb-7">
          <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-7 w-7 bg-[var(--light)] flex items-center justify-center text-[80%] text-[var(--dark-primary)]/90 rounded-2xl z-2">
            OR
          </span>
        </div>

        <div class="h-auto w-full text-center">
          <button class="h-auto w-full flex items-center justify-center rounded-md py-2 text-[85%] text-[var(--dark-primary)] font-medium bg-[var(--light)] border-2 border-solid border-[#d1d1d19e]/60 outline-none">
            <span class="h-8 w-8 bg-[var(--primary)]/5 rounded-[50%] flex items-center justify-center text-[80%] me-2">
              <i class="bi bi-envelope-fill text-[140%] text-[#00ADF6]"></i>
            </span>
            Continue with Email 
          </button>       
        </div>
      </div>

    </div>
    <!----- MOBILE-NUMBER-VERFICATION ------->

  </div>
  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->

  <!----------------------------------- PRE-LOADER ------------------------------------------------->
  <div id="PreLoader" class="pre-loader fixed top-0 left-0 size-full flex items-center justify-center bg-[var(--light)] z-100">

      </div>

      <div class="h-auto w-full px-8">
        <h5 class="text-[130%] font-medium text-[var(--dark-primary)] min-[576px]:text-[150%] mb-1">Enter OTP</h5>
        <p class="text-[75%] text-[var(--dark-primary)]/90 mb-6 min-[576px]:text-[85%]">Please enter the OTP sent to your mobile number.</p>

        <div class="h-auto w-full mb-6">
          <div class="flex items-center justify-center gap-x-4">
            <input type="tel" class="h-12 w-13 bg-[var(--light)] border border-solid border-[#d1d1d19e] outline-none rounded-[5px] py-3 text-[85%] text-[var(--dark-primary)] font-medium text-center min-[576px]:text-[95%] otp-input" placeholder="-" />
            <input type="tel" class="h-12 w-13 bg-[var(--light)] border border-solid border-[#d1d1d19e] outline-none rounded-[5px] py-3 text-[85%] text-[var(--dark-primary)] font-medium text-center min-[576px]:text-[95%] otp-input" placeholder="-" />
            <input type="tel" class="h-12 w-13 bg-[var(--light)] border border-solid border-[#d1d1d19e] outline-none rounded-[5px] py-3 text-[85%] text-[var(--dark-primary)] font-medium text-center min-[576px]:text-[95%] otp-input" placeholder="-" />
            <input type="tel" class="h-12 w-13 bg-[var(--light)] border border-solid border-[#d1d1d19e] outline-none rounded-[5px] py-3 text-[85%] text-[var(--dark-primary)] font-medium text-center min-[576px]:text-[95%] otp-input" placeholder="-" />
          </div>
        </div>

        <a href="login-otp.html" class="block text-[80%] text-[#1951A6] font-semibold text-center !underline mb-6">
          Resend OTP

        <div class="h-auto w-full text-center mb-10">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkLab Patient Portal | Secure Patient Management Application</title>

  <meta name="title" content="ThinkLab Patient Portal Application | A Trusted Patient Management Software of India" />
  <meta name="description" content="Loading... | ThinkLab Patient Portal Application | A Trusted Patient Management Software of India" />
  <meta name="keywords" content="Patient Portal, Patient Management Software, Healthcare Software, Clinic Management, Patient Management, ThinkLab, Medical Software India" />
  <meta name="author" content="Thinkwide Digital Health Pvt. Ltd." />

  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />

  <link rel="canonical" href="https://patient.thinklab.in/" />

  <meta name="theme-color" content="#0B28A8" />
  <meta name="application-name" content="ThinkLab Patient Portal" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">
  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->

  <!------------------ CSS FOR BOOTSTRAP-ICON FILES COMPLETE ---------------------->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!------------------ CSS FOR BOOTSTRAP-ICON FILES COMPLETE ---------------------->
</head>

<body>

  <!----------------------------------- PRE-LOADER ------------------------------------------------->
  <div id="PreLoader" class="pre-loader fixed top-0 left-0 size-full flex items-center justify-center bg-[var(--light)] z-100">
    <div class="pg-loader flex gap-2 px-4 py-1 border border-solid border-[#e8e8e8] rounded-2xl bg-[#ffffffe6] drop-shadow-xl">
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
    </div>
  </div>
  <!----------------------------------- PRE-LOADER ------------------------------------------------->

  <!----------------------------------- BOOKING-SELECTION SECTION ------------------------------------------------->
  <section class="h-auto w-full">

    <!----- SIDEBAR-MENU ------->
    <aside id="SideBar" class="h-auto w-full fixed bottom-0 z-101 bg-[var(--light)] rounded-tl-[15px] rounded-tr-[15px] pb-25 bg-linear-to-t from-[#F0F8FF]/40 to-[var(--light)] translate-y-full opacity-0 transition-all duration-300 ease-in-out">  
      <div class="mt-[-40px] mx-auto h-auto w-40 mb-3">
        <img src="assets/images/thinklab-logo-sidebar.png" alt="brand logo">
      </div>

      <div class="h-90 overflow-y-auto">

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='dashboard.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-window-sidebar text-[90%]"></i>
          </div>
          Dashboard
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='index.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-calendar2-check text-[90%]"></i>
          </div>
          Booking
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='prescription.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-bookmark text-[90%]"></i>
          </div>
          Prescription
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="openTransactionSetupModal()">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-cash-coin text-[90%]"></i>
          </div>
          Financial Transaction
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='consultant.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-person-workspace text-[90%]"></i>
          </div>
          Consultant
        </button>
        
        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='centre.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-building text-[90%]"></i>
          </div>
          Centre
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='registration.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-file-earmark-text text-[90%]"></i>
          </div>
          Registration
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='s-link-tracking.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-person-check text-[90%]"></i>
          </div>
          Sent Link Tracking
        </button>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="toggleSubMenu(this)">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-link-45deg text-[90%]"></i>
          </div>
          Refer to Consultant
        </button>

        <div class="sub-menu pb-2 px-5 overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-in-out">

          <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='refer-in.html'">
            <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
              <i class="bi bi-box-arrow-up-left text-[90%]"></i>
            </div>
            Refer-In
          </button>

          <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='refer-out.html'">
            <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
              <i class="bi bi-box-arrow-up-right text-[90%]"></i>
            </div>
            Refer-Out
          </button>
        </div>

        <button class="text-left py-3 px-8 h-auto w-full border-b border-solid border-[var(--dark-primary)]/10 text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='refer-diagnostics.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-building-gear text-[90%]"></i>
          </div>
          Refer to Centre
        </button>

        <button class="text-left py-3 px-8 h-auto w-full text-[var(--primary)] font-medium text-[90%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[100%]" onclick="window.location.href='c-charges.html'">
          <div class="h-8 w-8 rounded-2xl border border-solid border-[var(--primary)]/20 bg-[var(--secondary)]/20 flex items-center justify-center me-3">
            <i class="bi bi-calendar3 text-[90%]"></i>
          </div>
          Clinic & Charges
        </button>
      </div>

    </aside>
    <!----- SIDEBAR-MENU ------->

    <!----- BOTTOM-ISLAND ------->
    <div class="fixed bottom-0 h-auto w-full py-3 bg-[var(--light)] flex items-center justify-center gap-x-20 shadow-[0_-10px_25px_0_#00000010] z-102">
      <a href="index.html">
        <i class="bi bi-house-door text-[180%] text-[var(--primary)]/50"></i>
      </a>
      <a href="javascript:void(0)" class="mt-[-40px] flex items-center justify-center h-16 w-16 bg-linear-to-l from-[var(--primary)] to-[#0179f6] border-2 border-solid border-[var(--light)] rounded-[100px]" onclick="openSideBarMenuToggle()">
        <i class="bi bi-list text-[180%] text-[var(--light)]"></i>
      </a>
      <a href="profile.html">
        <i class="bi bi-person text-[180%] text-[var(--primary)]/50"></i>
      </a>
    </div>
    <!----- BOTTOM-ISLAND ------->
    
    <main class="h-screen w-full bg-linear-to-b from-[#F4F2F2]/40 to-[var(--light)]">

      <!----- TOP-BAR ------->
      <div class="h-auto py-4 px-6 w-full fixed top-0 left-0 flex items-center justify-between z-100">
        <h5 class="text-[135%] text-[var(--dark-primary)]/80 font-medium">Good Morning!</h5>
        <span class="block text-[85%] text-[var(--dark-primary)]/60 font-medium mt-[-2px]">Hello, Puja</span>
      </div>
      <!----- TOP-BAR ------->

      <!----- PAGE-CONTENT ------->
      <div class="content h-auto w-full bg-[var(--light)] py-1 rounded-tl-[15px] rounded-tr-[15px]">

        <!----- CONTENT-HEADING ------->
        <div class="h-auto w-full flex items-center justify-between border-b border-solid border-[#00000010] py-3 px-5">
          <h5 class="text-[var(--dark)]/70 font-semibold text-[110%] flex items-center hover:bg-[var(--secondary)] min-[576px]:text-[120%]">
            <div class="h-10 w-10 rounded-[50%] border border-solid border-[var(--primary)]/30 bg-[var(--secondary)]/30 flex items-center justify-center me-3">
              <i class="bi bi-calendar2-check text-[80%] text-[var(--primary)]/90"></i>
            </div>
            Booking <span class="text-[70%] font-medium pl-1">[For Think Lab Users]</span>
          </h5>
          <button class="h-11 w-11 rounded-[50%] bg-[var(--secondary)]/30 border-none flex items-center justify-center" onclick="openBookingSetupModal()">
            <img src="assets/images/filter.png" alt="filter icon" class="scale-35" />
          </button>
        </div>
        <!----- CONTENT-HEADING ------->
        
      </div>
      <!----- PAGE-CONTENT ------->

    </main>

  </section>
  <!----------------------------------- BOOKING-SELECTION SECTION ------------------------------------------------->

  <script src="assets/js/tailwind.js" type="text/javascript"></script>

  <script src="assets/js/custom-modal.js" type="text/javascript"></script>

  <!------------------------------------ JS FOR CUSTOM-MENU FILES START -------------------------------------------->
  <script src="assets/js/custom-menu.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR CUSTOM-MENU FILES COMPLETE ---------------------------------------->

  <!------------------------------------ JS FOR MAIN FILES START -------------------------------------------->
  <script src="assets/js/main.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR MAIN FILES COMPLETE ---------------------------------------->

</body>
</html>

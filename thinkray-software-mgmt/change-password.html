<body>

  <!----------------------------------- LOG-IN-PAGE ------------------------------------------------->
  <main class="login-page change-pass">

    <section class="login-section">

      <div class="login-section-inner">
        <div class="login-card">
          <div class="login-logo hide-lg">
            <img src="assets/images/thinkray-logo.png" alt="logo image" />
          </div>
          
          <div class="login-card-heading">
            <h3>Change Password</h3>
            <p>Update Password to continue ThinkRay</p>
          </div>

          <form method="" action="" id="mainLoginForm">
            <div class="row gx-3 gy-3">
              <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                <label>Current Password *</label>
                <div class="login-input">
                  <i class="bi bi-lock login-left-icon"></i>
                  <input type="password" id="current_password" class="default-pass" name="current_password" placeholder="Enter current password" required />
                  <i class="bi bi-eye login-right-icon" onclick="togglePassword()"></i>
                </div>
              </div>

              <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                <label>New Password *</label>
                <div class="login-input">
                  <i class="bi bi-lock login-left-icon"></i>
                  <input type="password" id="confirm_password" class="default-pass" name="confirm_password" placeholder="Enter new password" required />
                  <i class="bi bi-eye login-right-icon" onclick="togglePassword()"></i>
                </div>
              </div>

              <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                <label>Confirm Password *</label>
                <div class="login-input">
                  <i class="bi bi-lock login-left-icon"></i>
                  <input type="password" id="re_confirm_password" class="default-pass" name="re_confirm_password" placeholder="Re-Enter new password" required />
                  <i class="bi bi-eye login-right-icon" onclick="togglePassword()"></i>
                </div>
              </div>

              <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                <div class="content-table-btn-part mt-1">
                  <button type="submit" id="UpdateloginBtn" class="browse-btn w-100">
                    Confirm
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="login-footer">
          <a href="#">Privacy &amp; Data Policy</a>
          <span></span>
          <a href="#">Terms of Use</a>
          <span></span>
          <a href="#">Help</a>
        </div>
      </div>

    </section>

  </main>

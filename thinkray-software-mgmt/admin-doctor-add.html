                  </div>

                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <input type="tel" name="" value="" placeholder="Enter mobile number *" required>
                  </div>

                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <input type="email" name="" value="" placeholder="Enter email address *" required>
                  </div>

                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <input type="text" name="" value="" placeholder="Enter qualification *" required>
                  </div>

                  <div class="col-xl-6 col-md-6 col-sm-12 col-12">
                    <select name="" required>
                      <option value="0" selected="">Select modality *</option>
                      <option value="1">Others</option>
                    </select>
                  </div>

                  <div class="col-xl-4 col-md-4 col-sm-12 col-12">
                    <div class="trend-verified-input">
                      <input type="text" name="" value="" placeholder="Enter login username *" required>
                    </div>

                  </div>

                    <input type="password" name="" value="" placeholder="Enter login Password *" required>
                  </div>

                  <div class="col-xl-4 col-md-4 col-sm-12 col-12">
                    <select name="" required>
                      <option value="0">Select status *</option>
                      <option value="1" selected="">Active</option>
                      <option value="1">In-active</option>
                    </select>
                  </div>

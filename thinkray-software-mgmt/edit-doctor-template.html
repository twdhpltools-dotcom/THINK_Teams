<!DOCTYPE html>
<html lang="en">
<head>      
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkRay Edit Individual Doctor Investigation | The Extraordinary Laboratory Management System Software | Thinkwide Digital Health</title>

  <meta name="title" content="Welcome To ThinkRay | The Extraordinary Laboratory Management System Software | Thinkwide Digital Health" />
  <meta name="description" content="ThinkRay Laboratory Management | The Extraordinary Laboratory Management System Software | Thinkwide Digital Health" />
  <meta name="keywords" content="Laboratory Management Software, Healthcare Software, ThinkRay Management, Lab Management, Thinkray, Medical Software India" />
  <meta name="author" content="Thinkwide Digital Health Pvt. Ltd." />

  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />

  <!------------------ CSS FOR BOOTSTRAP FILES COMPLETE ---------------------->
  <link rel="stylesheet" href="assets/css/bootstrap-min.css">
  <!------------------ CSS FOR BOOTSTRAP FILES COMPLETE ---------------------->

  <!------------------ CSS FOR BOOTSTRAP-ICON FILES COMPLETE ---------------------->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!------------------ CSS FOR BOOTSTRAP-ICON FILES COMPLETE ---------------------->

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->
</head>

<body>

  <!----------------------------------- PENDING-ACCEPT-PAGE ------------------------------------------------->
  <main class="main-page">

    <!----- TOP-HEADER ------->
    <div class="top-header">
      <div class="row align-items-center justify-content-between">

        <div class="col-xl-3 col-lg-12 col-md-9 col-9">
          <div class="top-header-user-name">
            <h4>Thinkray Doctor</h4>
          </div>
        </div>

        <div class="col-xl-9 col-lg-12 col-md-3 col-3">
          <div id="mobileMenuContent" class="top-header-content">

            <div class="user-supports">
              <div class="user-notification">
                <img src="assets/images/notification-svgrepo-icon.png" alt="notification icon" />
              </div>
              <div class="profile-wrapper">

                <div class="user-profile" onclick="toggleProfileMenu(event)">
                  <h6>Dr. Abhijit Das</h6>
                  <i class="bi bi-chevron-down"></i>
                </div>

                <!----- ANIMATED-TOGGLER-MENU ------->
                <div id="ProfileSubMenu" class="profile-submenu">
                  <a href="change-password.html">
                    <span class="profile-submenu-icon">
                      <img src="assets/images/password-icon.png" alt="change password icon">
                    </span>
                    Change Password
                  </a>
                  <a href="login.html" class="log-anchor">
                    <span class="profile-submenu-icon">
                      <img src="assets/images/logout-icon.png" alt="logout icon">
                    </span>
                    Logout
                  </a>
                </div>
                <!----- ANIMATED-TOGGLER-MENU ------->

              </div>
            </div>

          </div>

          <div class="mobile-menu-toggle" onclick="openMobileMenu()">
            <i class="bi bi-three-dots-vertical"></i>
          </div>
        </div>

      </div>        
    </div>
    <!----- TOP-HEADER ------->

    <!----- SIDEBAR-MENU ------->
    <aside id="SideBarMenu" class="sidebar-menu">
      <div class="sidebar-menu-top">

        <div class="logo">
          <img src="assets/images/thinkray-logo.png" alt="logo image" />
        </div>

        <div class="sidebar-menu-toggle" onclick="toggleSideBarMenu()">
          <img src="assets/images/menu-toggle-icon.png" alt="menu toggle icon" />
        </div>

      </div>

      <div class="sidebar-menu-nav">
        <a href="doctor-index.html">
          <span class="sidebar-menu-nav-icon">
            <i class="bi bi-clock"></i>
          </span>
          <p>Pending Accept</p>
          <em class="counter-chip">8</em>
        </a>
        <a href="doctor-assign.html">
          <span class="sidebar-menu-nav-icon">
            <i class="bi bi-person-check"></i>
          </span>
          <p>Assign</p>
          <em class="counter-chip">12</em>
        </a>
        <a href="doctor-approve.html">
          <span class="sidebar-menu-nav-icon">
            <i class="bi bi-check2-circle"></i>
          </span>
          <p>Approve</p>
          <em class="counter-chip">24</em>
        </a>
        <a href="doctor-request.html">
          <span class="sidebar-menu-nav-icon">
            <i class="bi bi-file-earmark-check"></i>
          </span>
          <p>Request Review</p>
          <em class="counter-chip">4</em>
        </a>
        <a href="doctor-template.html" class="active">
          <span class="sidebar-menu-nav-icon">
            <i class="bi bi-copy"></i>
          </span>
          <p>Template</p>
        </a>
      </div>
    </aside>
    <!----- SIDEBAR-MENU ------->
    
    <section class="page-section">
      <div class="content-formalities">
        <div class="row gx-3 gy-2 justify-content-space-between mb-2">
          <div class="col-xl-12 col-md-12 col-sm-12 col-12">
            <div class="page-section-heading">
              <h1>Edit Template</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="content-formalities">
        <div class="row gx-3 gy-4">
          <div class="col-xl-12 col-md-12 col-sm-12 col-12">
            <div class="field-formalities-box">
              
              <!----- HTML-LIVE-EDIT ------->
              <div class="editor-toolbar">
                <button type="button" onclick="editorCmd('undo')">
                  <i class="bi bi-arrow-counterclockwise"></i>
                </button>

                <button type="button" onclick="editorCmd('redo')">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>

                <select onchange="formatBlock(this.value)">
                  <option value="">Formats</option>
                  <option value="p">Paragraph</option>
                  <option value="h1">Heading 1</option>
                  <option value="h2">Heading 2</option>
                  <option value="h3">Heading 3</option>
                </select>

                <button type="button" onclick="editorCmd('bold')">
                  <i class="bi bi-type-bold"></i>
                </button>

                <button type="button" onclick="editorCmd('italic')">
                  <i class="bi bi-type-italic"></i>
                </button>

                <button type="button" onclick="editorCmd('underline')">
                  <i class="bi bi-type-underline"></i>
                </button>

                <button type="button" onclick="editorCmd('copy')">
                  <i class="bi bi-files"></i>
                </button>

                <button type="button" onclick="editorCmd('insertUnorderedList')">
                  <i class="bi bi-list-ul"></i>
                </button>

                <button type="button" onclick="editorCmd('insertOrderedList')">
                  <i class="bi bi-list-ol"></i>
                </button>

                <button type="button" onclick="editorCmd('justifyLeft')">
                  <i class="bi bi-text-left"></i>
                </button>

                <button type="button" onclick="editorCmd('justifyCenter')">
                  <i class="bi bi-text-center"></i>
                </button>

                <button type="button" onclick="editorCmd('justifyRight')">
                  <i class="bi bi-text-right"></i>
                </button>

                <button type="button" onclick="editorCmd('justifyFull')">
                  <i class="bi bi-justify"></i>
                </button>

                <label class="toolbar-color">
                  <i class="bi bi-fonts"></i>
                  <input type="color" onchange="setTextColor(this.value)">
                </label>
              </div>

              <form method="" action="">
                <div class="row gx-3 gy-3">
                  <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                    <input type="text" name="" value="" placeholder="Template Name" />
                  </div>
                  
                  <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                    <textarea rows="3" name="" value="" placeholder="Write the report template here..."></textarea>
                  </div>

                  <div class="col-xl-12 col-md-12 col-sm-12 col-12">
                    <div class="content-table-btn-part justify-content-end">
                      <button type="submit" class="submitted-btn" onclick="window.location.href='doctor-template-view-lists.html'">Cancel</button>
                      <button type="submit" class="browse-btn">Save Change</button>
                    </div>
                  </div>
                </div>
              </form>
              <!----- HTML-LIVE-EDIT ------->

            </div>
          </div>
        </div>
      </div>
    </section>

  </main>
  <!----------------------------------- PENDING-ACCEPT-PAGE ------------------------------------------------->

  <script src="assets/js/jquery-min.js" type="text/javascript"></script>

  <script src="assets/js/bootstrap-bundle-min.js" type="text/javascript"></script>

  <script src="assets/js/custom-menu.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR CUSTOM-MENU FILES COMPLETE ---------------------------------------->

  <!------------------------------------ JS FOR MAIN FILES START -------------------------------------------->
  <script src="assets/js/main.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR MAIN FILES COMPLETE ---------------------------------------->

</body>
</html>

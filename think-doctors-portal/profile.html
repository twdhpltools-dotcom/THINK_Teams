<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Profile | ThinkLab Doctor Portal</title>

  <!----------------- CSS FOR BOOTSTRAP FILES START ------------------------>
  <link rel="stylesheet" href="assets/css/bootstrap-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!----------------- CSS FOR BOOTSTRAP FILES COMPLETE ------------------------>

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">
  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->
</head>

<body>

  <section class="inner-page">
    <div class="inner-page-section w-100">
      <div class="topbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-primary mobile-toggle" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
          <h5 class="mb-0 fw-bold">ThinkLab Doctor Portal</h5>
        </div>
        <span class="badge-soft profile-badge-top">
          <a href="profile.html">
            <img class="me-1" src="assets/images/dummy-doctor.jpg" alt="soctor profile image" />
            Dr. Abhimanyu
          </a>
        </span>
      </div>

      <div class="container">
        <div class="content">
          <section class="portal-section">
            <div class="section-card">
              <div class="row g-3">
                <div class="col-md-12">
                  <div class="doctor-card">
                    <div class="row g-3 align-items-center">
                      <div class="col-lg-4 col-md-12">
                        <div class="profile-img-block">
                          <img src="assets/images/dummy-doctor.jpg" alt="doctor-img" />
                        </div>
                      </div>
                      <div class="col-lg-8 col-md-12">
                        <h4 class="fw-bold my-4" style="color: #0b8f78;"><i class="bi bi-person-gear"></i> Doctor Profile Management</h4>
                        <div class="row g-4">
                          <div class="col-md-6">
                            <div class="profile-block">
                              <p class="mb-2">Doctor's Full Name:</p>
                              <h5 class="fw-bold">Dr. Ranjit Halder</h5>
                              <a href="#" class="edit-ico" data-bs-toggle="modal" data-bs-target="#profile_name_edit_modal"><i class="bi bi-pencil"></i></a>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div class="profile-block">
                              <p class="mb-2">Contact No:</p>
                              <h5 class="fw-bold">9876543210</h5>
                              <a href="#" class="edit-ico" data-bs-toggle="modal" data-bs-target="#profile_mob_edit_modal"><i class="bi bi-pencil"></i></a>
                            </div>
                          </div>
                          <div class="col-md-12">
                            <div class="profile-block">
                              <p class="mb-2">Address:</p>
                              <h5 class="fw-bold">21/1, Shibpur, Howrah 712 134</h5>
                              <a href="#" class="edit-ico" data-bs-toggle="modal" data-bs-target="#profile_add_edit_modal"><i class="bi bi-pencil"></i></a>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <label class="form-label fw-bold">Show Number on Portal ?</label>
                            <div class="form-check mb-2">
                              <input class="form-check-input" type="checkbox" id="agreeYes" value="yes">
                              <label class="form-check-label" for="agreeYes">Yes</label>
                            </div>
                            <div class="form-check">
                              <input class="form-check-input" type="checkbox" id="agreeNo" value="no">
                              <label class="form-check-label" for="agreeNo">No</label>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <label class="form-label fw-bold">Show Fees on Portal ?</label>
                            <div class="form-check mb-2">
                              <input class="form-check-input" type="checkbox" id="agreeYes" value="yes">
                              <label class="form-check-label" for="agreeYes">Yes</label>
                            </div>
                            <div class="form-check">
                              <input class="form-check-input" type="checkbox" id="agreeNo" value="no">
                              <label class="form-check-label" for="agreeNo">No</label>
                            </div>
                          </div>
                          <div class="col-md-12 text-end">
                            <button class="btn btn-brand mt-2">
                              Update
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_name_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Doctor's Full Name:</label>
              <input id="doctorFName" type="text" class="form-control" placeholder="" value="Dr. Ranjit Halder">
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_mob_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Contact No:</label>
              <input id="doctorMobile" type="number" class="form-control" placeholder="" value="9876543210">
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_add_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Doctor's Full Name:</label>
              <textarea id="doctorAdd" rows="4" class="form-control" placeholder="" value="">21/1, Shibpur, Howrah 712 134</textarea>
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Profile | ThinkLab Doctor Portal</title>

  <!----------------- CSS FOR BOOTSTRAP FILES START ------------------------>
  <link rel="stylesheet" href="assets/css/bootstrap-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!----------------- CSS FOR BOOTSTRAP FILES COMPLETE ------------------------>

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">
  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->
</head>

<body>

  <div class="inner-page-section">

    <aside id="sidebar" class="sidebar">
      <div class="d-flex align-items-center gap-2 mb-4">
        <div class="brand-icon mt-3 mx-3">
          <img src="assets/images/thinklab-logo.webp" alt="brand logo">
        </div>
      </div>

      <button class="nav-btn mt-2" onclick="showSection('dashboard',this)">
        <i class="bi bi-ui-checks-grid me-2"></i> Dashboard
      </button>

      <button class="nav-btn active" onclick="showSection('booking',this)">
        <i class="bi bi-file-earmark-medical me-2"></i > Booking
      </button>

      <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#financial_transaction_modal">
        <i class="bi bi-bank me-2"></i > Financial Transaction
      </button>

      <button class="nav-btn mt-2" onclick="showSection('consultant',this)">
        <i class="bi bi-people me-2"></i> Find Consultant
      </button>

      <button class="nav-btn mt-2" onclick="showSection('selfRegistration',this)">
        <i class="bi bi-file-bar-graph me-2"></i> Registration
      </button>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('sentLinkTracking',this)">Sent Link Tracking</button>
      </div>

      <button class="nav-btn mt-2" onclick="showSection('refer',this)">
        <i class="bi bi-person-gear"></i> Refer
      </button>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('referIn',this)">Refer-In</button>
      </div>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('referOut',this)">Refer-Out</button>
      </div>
    </aside>

    <main class="main w-100">
      <div class="topbar d-flex justify-content-between align-items-center">
        <div class="mobile-info-head">
          <h5>Edit Profile</h5>
        </div>
        <div class="d-flex align-items-center profile-top-right">
          <span class="badge-soft profile-badge-top ms-2 p-0 m-0">
            <a href="profile.html">
              <img src="assets/images/dummy-doctor.jpg" alt="soctor profile image" />
            </a>
          </span>
        </div>
      </div>

      <div class="main-overlay">

        <div class="container">
          <div class="content py-0">
            <section class="portal-section">
              <div class="row align-items-center gx-4 mb-2">
                <!-- <div class="col-lg-12 col-md-12 col-12">
                  <div class="profile-main-img-info">
                    <h2>Dr. Priya Saha</h2>
                    <h6>MBBS</h6>
                  </div>
                </div> -->
                <div class="profile-top-decor">
                
                  <div class="col-lg-5 col-md-5 col-5">
                    <div class="profile-img-block">
                      <img src="assets/images/dummy-doctor.jpg" alt="doctor-img" />
                      <div class="profile-pic-change" data-bs-toggle="modal" data-bs-target="#profile_pic_chng">
                        <i class="bi bi-camera-fill"></i>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- <div class="mobile-table-head-new">
                <h3>Edit Profile</h3>
              </div> -->

              <div class="section-card profile mt-5">

                <div class="row align-items-center">
                  <div class="col-lg-8 col-md-12">
                    <div class="row">
                      <div class="col-md-6 col-12">
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-person"></i>
                            <input type="text" class="form-control" name="" value="Name" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-telephone"></i>
                            <input type="tel" class="form-control" name="" value="Mobile Number" placeholder="" />
                          </div>
                        </div>
                        <!-- <div class="profile-block">
                          <p>Contact No:</p>
                          <h5>9876543210</h5>
                        </div> -->
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-envelope"></i>
                            <input type="email" class="form-control" name="" value="Email" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-geo-alt"></i>
                            <input type="text" class="form-control" name="" value="Address" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <!-- <div class="profile-info-icon me-2">
                            <img src="assets/images/stethoscope.png" alt="profile info icon" />
                          </div> -->
                          <div class="icon-input">
                            <i class="bi bi-building"></i>
                            <input type="text" class="form-control" name="" value="Department" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-mortarboard"></i>
                            <input type="text" class="form-control" name="" value="Qualification" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <i class="bi bi-briefcase"></i>
                            <input type="text" class="form-control" name="" value="Experiences" placeholder="" />
                          </div>
                        </div>
                        <div class="profile-img-info">
                          <div class="icon-input">
                            <!-- <h6>Fees</h6> -->
                            <i class="bi bi-currency-rupee"></i>
                            <input type="text" class="form-control" name="" value="Fees" placeholder="" />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="section-card">
                <div class="row align-items-center">
                  <div class="col-lg-8 col-md-12">
                    <div class="row">
                      <div class="col-md-6 mb-3">
                        <div class="d-flex align-items-center">
                          <label class="form-label me-3">Show Number on Portal ?</label>
                          <div class="d-flex align-items-center">
                            <div class="form-check me-2">
                              <input class="form-check-input" type="checkbox" id="agreeYes" value="yes">
                              <label class="form-check-label" for="agreeYes">Yes</label>
                            </div>
                            <div class="form-check">
                              <input class="form-check-input" type="checkbox" id="agreeNo" value="no">
                              <label class="form-check-label" for="agreeNo">No</label>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="d-flex align-items-center">
                          <label class="form-label me-3">Show Fees on Portal ?</label>
                          <div class="d-flex align-items-center">
                            <div class="form-check me-2">
                              <input class="form-check-input" type="checkbox" id="agreeYes" value="yes">
                              <label class="form-check-label" for="agreeYes">Yes</label>
                            </div>
                            <div class="form-check">
                              <input class="form-check-input" type="checkbox" id="agreeNo" value="no">
                              <label class="form-check-label" for="agreeNo">No</label>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-12 text-center mt-3">
                        <button class="btn btn-brand mt-2">
                          Update
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>

        <div class="bottom-island position-relative">
          <div class="bottom-island-bar">
            <a href="#" class="bottom-island-pill">
              <i class="bi bi-house-check"></i>
            </a>
            <a href="#" class="bottom-island-pill active" onclick="toggleSidebar()">
              <i class="bi bi-list"></i>
            </a>
            <a href="#" class="bottom-island-pill">
              <i class="bi bi-person-circle"></i>
            </a>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_pic_chng" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-body py-0">
          <div class="modal-normal-instrustion">
            <h6>View Profile Pictue</h6>
          </div>
          <div class="modal-normal-instrustion">
            <h6>Change Profile Pictue</h6>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_name_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Doctor's Full Name:</label>
              <input id="doctorFName" type="text" class="form-control" placeholder="" value="Dr. Ranjit Halder">
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_mob_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Contact No:</label>
              <input id="doctorMobile" type="number" class="form-control" placeholder="" value="9876543210">
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_add_edit_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Edit The Profile</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="filter-box row mt-2 g-3">
            <div class="col-md-12">
              <label class="form-label">Doctor's Full Name:</label>
              <textarea id="doctorAdd" rows="4" class="form-control" placeholder="" value="">21/1, Shibpur, Howrah 712 134</textarea>
            </div>
          </div>
          <div class="text-center">
            <button class="btn btn-brand w-100" data-bs-dismiss="modal">
              Update <i class="bi bi-pencil px-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

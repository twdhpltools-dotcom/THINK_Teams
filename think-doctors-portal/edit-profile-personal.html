<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Doctor Profile | ThinkLab Doctor Portal</title>

  <!----------------- CSS FOR BOOTSTRAP FILES START ------------------------>
  <link rel="stylesheet" href="assets/css/bootstrap-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!----------------- CSS FOR BOOTSTRAP FILES COMPLETE ------------------------>

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">
  <!------------------ CSS FOR MAIN FILES COMPLETE ---------------------->
</head>

<body>

  <div id="preloader" class="preloader">
    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="inner-page-section profile">

    <aside id="sidebar" class="sidebar">
      <div class="d-flex align-items-center gap-2 mb-4">
        <div class="brand-icon mt-3 mx-3">
          <img src="assets/images/thinklab-logo.webp" alt="brand logo">
        </div>
      </div>

      <button class="nav-btn mt-2" onclick="showSection('dashboard',this)">
        <i class="bi bi-ui-checks-grid me-2"></i> Dashboard
      </button>

      <button class="nav-btn active" onclick="showSection('booking',this)">
        <i class="bi bi-file-earmark-medical me-2"></i > Booking
      </button>

      <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#financial_transaction_modal">
        <i class="bi bi-bank me-2"></i > Financial Transaction
      </button>

      <button class="nav-btn mt-2" onclick="showSection('consultant',this)">
        <i class="bi bi-people me-2"></i> Consultant
      </button>

      <button class="nav-btn mt-2" onclick="showSection('selfRegistration',this)">
        <i class="bi bi-file-bar-graph me-2"></i> Self Registration
      </button>

      <button class="nav-btn mt-2" onclick="showSection('sentLinkTracking',this)">
        <i class="bi bi-file-check me-2"></i> Sent Link Tracking
      </button>

      <button class="nav-btn mt-2" onclick="toggleReferMenu()">
        <i class="bi bi-building-add me-2"></i> Refer
      </button>

      <div class="sub-menu" id="refer_sub">
        <button class="nav-btn" onclick="showSection('referIn',this)">
          <i class="bi bi-person-plus me-2"></i> Refer-In
        </button>

        <button class="nav-btn" onclick="showSection('referOut',this)">
          <i class="bi bi-person-dash me-2"></i> Refer-Out
        </button>
      </div>

      <button class="nav-btn" onclick="showSection('clinic',this)">
        <i class="bi bi-clock-history me-2"></i> Clinic & Schedule
      </button>
    </aside>

    <main class="main w-100">

      <div class="main-overlay">

        <div class="container">
          <div class="content pt-0 px-0">
            <section class="portal-section">
              <div class="row align-items-center gx-4">
                <div class="profile-top-decor">

                  <div class="sec-card-back-btn" data-bs-toggle="modal" data-bs-target="#edit_profile_confirmation">
                    <img src="assets/images/back.png" alt="back icon">
                  </div>
                
                  <div class="col-sm-2 col-12">
                    <div class="profile-img-block">
                      <span class="d-block" data-bs-toggle="modal" data-bs-target="#profile_pic_shwn">
                        <img src="assets/images/dummy-doctor.jpg" alt="doctor-img" />
                      </span>
                      <div class="profile-pic-change" data-bs-toggle="modal" data-bs-target="#profile_pic_chng">
                        <i class="bi bi-camera-fill"></i>
                      </div>
                    </div>
                    <div class="profile-txt-block mt-2">
                      <h5 class="fw-bold">Dr. Amit Kumar Das</h5>
                      <span class="badge bg-warning"><i class="bi bi-person me-1"></i> Top Member</span>
                     </div>              
                  </div>
                </div>
              </div>

              <div class="row gx-3">
                <div class="col-sm-12 col-12">

                  <div class="mobile-table-head-new theme-two mb-1">
                    <span class="decor-head-circle-outer me-2">
                      <span class="decor-head-circle-inner"></span>
                    </span>
                    <h3>Personal Information</h3>
                  </div>

                  <div class="row mb-4">
                    <div class="col-sm-12 col-12">
                      <div class="doctor-card menu-card profile flex-wrap">
                        <div class="w-100 mb-1">
                          <label class="form-label">Name</label>
                          <input id="" type="text" class="form-control" value="Dr. Priya Saha" placeholder="Enter your name">
                        </div>
                        <div class="w-100 mb-1">
                          <label class="form-label">Mobile Number</label>
                          <input id="" type="tel" class="form-control" value="+91 XXXXXXXX87" placeholder="Enter your mobile number">
                        </div>
                        <div class="w-100 mb-1">
                          <label class="form-label">Address</label>
                          <input id="" type="text" class="form-control" value="91, ABC Street, India" placeholder="Enter your full address">
                        </div>
                        <div class="w-100">
                          <label class="form-label">Email</label>
                          <input id="" type="email" class="form-control" value="@example00@gmail.com" placeholder="Enter your email">
                        </div>
                      </div>
                    </div>

                  </div>

                  <div class="mobile-table-head-new theme-one mb-1">
                    <span class="decor-head-circle-outer me-2">
                      <span class="decor-head-circle-inner"></span>
                    </span>
                    <h3>Portal Shower</h3>
                  </div>

                  <div class="row">
                    <div class="col-sm-12 col-12">
                      <div class="doctor-card menu-card profile flex-wrap">
                        <div class="d-flex align-items-center w-100 mb-2">
                          <label class="form-label mb-0">Show Number on Portal</label>
                          <div class="form-check form-switch ms-auto">
                            <input class="form-check-input" type="checkbox" role="switch" id="">
                          </div>
                        </div>
                        <div class="d-flex align-items-center w-100">
                          <label class="form-label mb-0">Show Fees on Portal</label>
                          <div class="form-check form-switch ms-auto">
                            <input class="form-check-input" type="checkbox" role="switch" id="">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

            </section>
          </div>
        </div>

        <div class="bottom-island">
          <div class="bottom-island-bar">
            <a href="index.html" class="bottom-island-pill">
              <i class="bi bi-house-check"></i>
            </a>
            <a href="#" class="bottom-island-pill active" onclick="toggleSidebar()">
              <i class="bi bi-list"></i>
            </a>
            <a href="profile.html" class="bottom-island-pill">
              <i class="bi bi-person-circle"></i>
            </a>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="edit_profile_confirmation" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header" style="background:#eef7ff;">
          <div>
            <h5 class="modal-title fw-bold">Confirmation</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body pt-0 pb-2">
          <h6 class="confirmation-short my-3 text-center">Are you sure want to back on the Profile ?</h6>
          <div class="filter-box row gx-1 p-0 my-2">
            <div class="col-sm-6 col-6">
              <button class="btn-re-brand type-four" onclick="window.location.href='profile.html'"> <i class="bi bi-check-circle me-1"></i> Save</button>
            </div>
            <div class="col-sm-12 col-6 text-end">
              <button class="btn-re-brand type-two" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i> Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_pic_shwn" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        <div class="modal-body py-0 px-0">
          <div class="profile-lightbox">
            <img src="assets/images/dummy-doctor.jpg" alt="doctor-img" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!--------------------- MODAL SECTION ------------------------>
  <div class="modal fade" id="profile_pic_chng" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-body py-1">
          <div class="modal-normal-instrustion">
            <a href="#">Click Photo</a>
          </div>
          <div class="modal-normal-instrustion">
            <a href="#">Choose from Gallery</a>
          </div>
          <div class="modal-normal-instrustion">
            <a href="#" data-bs-dismiss="modal">Cancel</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--------------------- MODAL SECTION ------------------------>

  <!----------------------------------- JS FOR BOOTSTRAP FILES START ------------------------------------------------->
  <script src="assets/js/bootstrap-bundle-min.js" type="text/javascript"></script>
  <!------------------------------------- JS FOR BOOTSTRAP FILES COMPLETED ------------------------------------------->

  <!------------------------------------ JS FOR MAIN FILES START -------------------------------------------->
  <script src="assets/js/main.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR MAIN FILES COMPLETE ---------------------------------------->

</body>
</html>

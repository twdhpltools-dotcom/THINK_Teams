<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual Form | ThinkLab Doctor Portal</title>

  <!----------------- CSS FOR BOOTSTRAP FILES START ------------------------>
  <link rel="stylesheet" href="assets/css/bootstrap-min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  <!----------------- CSS FOR BOOTSTRAP FILES COMPLETE ------------------------>

  <!------------------ CSS FOR MAIN FILES START ---------------------->
  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

  <div class="inner-page-section">

    <aside id="sidebar" class="sidebar">
      <div class="d-flex align-items-center gap-2 mb-4">
        <div class="brand-icon mt-3 mx-3">
          <img src="assets/images/thinklab-logo.webp" alt="brand logo">
        </div>
      </div>

      <button class="nav-btn mt-2" onclick="showSection('dashboard',this)">
        <i class="bi bi-ui-checks-grid me-2"></i> Dashboard
      </button>

      <button class="nav-btn active" onclick="showSection('booking',this)">
        <i class="bi bi-file-earmark-medical me-2"></i > Booking
      </button>

      <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#financial_transaction_modal">
        <i class="bi bi-bank me-2"></i > Financial Transaction
      </button>

      <button class="nav-btn mt-2" onclick="showSection('consultant',this)">
        <i class="bi bi-people me-2"></i> Find Consultant
      </button>

      <button class="nav-btn mt-2" onclick="showSection('selfRegistration',this)">
        <i class="bi bi-file-bar-graph me-2"></i> Registration
      </button>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('sentLinkTracking',this)">Sent Link Tracking</button>
      </div>

      <button class="nav-btn mt-2" onclick="showSection('refer',this)">
        <i class="bi bi-person-gear"></i> Refer
      </button>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('referIn',this)">Refer-In</button>
      </div>

      <div class="sub-menu">
        <button class="nav-btn" onclick="showSection('referOut',this)">Refer-Out</button>
      </div>
    </aside>

    <main class="main w-100">
      <div class="topbar d-flex justify-content-between align-items-center">
        <div class="mobile-info-head">
          <h5>Edit Profile</h5>
        </div>
        <div class="d-flex align-items-center profile-top-right">
          <span class="badge-soft profile-badge-top ms-2 p-0 m-0">
            <a href="profile.html">
              <img src="assets/images/dummy-doctor.jpg" alt="soctor profile image" />
            </a>
          </span>
        </div>
      </div>

      <div class="main-overlay">

        <div class="container">
          <div class="content">
            <div class="portal-section">
              <div class="head-portion">
                <h5 class="fw-bold m-0"><i class="bi bi-cursor-fill"></i> Add Patient Manually</h5>
              </div>
              <div class="row mt-2 gx-2 align-items-end">
                <div class="col-sm-6 col-12 mb-2">
                  <label class="form-label">Name</label>
                  <input id="patiendFullName" type="text" class="form-control" placeholder="Enter name">
                </div>
                <div class="col-sm-6 col-6 mb-2">
                  <label class="form-label">Gender</label>
                  <select id="patiendGender" class="form-select">
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                    <option value="0">Other</option>
                  </select>
                </div>
                <div class="col-sm-6 col-6 mb-2">
                  <label class="form-label">Age</label>
                  <input id="patiendAge" type="date" class="form-control">
                </div>
                <div class="col-sm-1 col-3 mb-2">
                  <label class="form-label">Mobile</label>
                  <select id="patiendMobNumberCode" class="form-select">
                    <option value="0">+91</option>
                    <option value="1">+123</option>
                    <option value="0">+01</option>
                    <option value="1">+77</option>
                    <option value="1">+57</option>
                  </select>
                </div>
                <div class="col-sm-5 col-9 mb-2">
                  <input id="patiendMobNumber" type="number" class="form-control" placeholder="Enter Mobile Number">
                </div>
                <div class="col-sm-6 col-6 mb-2">
                  <label class="form-label">ABHA Id</label>
                  <input id="patiendAbhId" type="text" class="form-control" placeholder="Enter ABHA id">
                </div>
                <div class="col-sm-6 col-6 mb-2">
                  <label class="form-label">Date</label>
                  <input id="patientDate" type="date" class="form-control">
                </div>
                <div class="col-sm-6 col-12 mb-2">
                  <label class="form-label">Time Slot</label>
                  <div class="time-slot-grid" id="patientTimeSlot">
                    <div class="time-slot-card">09:00 AM</div>
                    <div class="time-slot-card">09:30 AM</div>
                    <div class="time-slot-card">10:00 AM</div>
                    <div class="time-slot-card">10:30 AM</div>
                    <div class="time-slot-card">11:00 AM</div>
                    <div class="time-slot-card">11:30 AM</div>
                  </div>
                </div>
                <div class="col-sm-12 col-12 mb-2">
                    <input class="form-check-input" type="checkbox" id="" value="">
                    <label class="form-label ms-2">Confirm Booking</label>
                </div>
                <div class="col-sm-12 col-12 mb-2">
                  <label class="form-label">Symptoms / Notes</label>
                  <textarea id="patiendSymptoms" class="form-control" rows="4" placeholder="Enter symptoms"></textarea>
                </div>
                <div class="col-sm-12 col-12 mb-2">
                  <label class="form-label">Upload File</label>
                  <div class="d-flex align-items-center">
                    <input type="file" id="patiendUpload" class="form-control up-ip">
                    <label for="patiendUpload" class="my-0 ms-3 btn btn-brand up-btn"><i class="bi bi-upload"></i> Upload</label>
                  </div>
                </div>

                <div class="col-sm-3 col-12 mt-2">
                  <button type="submit" class="btn btn-brand w-50" onclick="">
                    Register
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bottom-island">
          <div class="bottom-island-bar">
            <a href="index.html" class="bottom-island-pill">
              <i class="bi bi-house-check"></i>
            </a>
            <a href="#" class="bottom-island-pill active" onclick="toggleSidebar()">
              <i class="bi bi-list"></i>
            </a>
            <a href="profile.html" class="bottom-island-pill">
              <i class="bi bi-person-circle"></i>
            </a>
          </div>
        </div>

      </div>
    </main>

  </div>

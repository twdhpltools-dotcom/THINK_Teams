<body>

  <section class="inner-page">
    <div class="inner-page-section w-100">
      <div class="topbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-primary mobile-toggle" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
          <h5 class="mb-0 fw-bold">ThinkLab Doctor Portal</h5>
        </div>
        <span class="badge-soft profile-badge-top">
          <a href="profile.html">
            <img class="me-1" src="assets/images/dummy-doctor.jpg" alt="soctor profile image" />
            Dr. Abhimanyu
          </a>
        </span>
      </div>

      <div class="container">
        <div class="content">
          <section class="portal-section">
            <div class="section-card">
              <div class="d-flex align-items-center justify-content-center mb-4">
                <h4 class="fw-bold">Patient Info</h5>
              </div>
              <div class="filter-box row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input id="patiendFullName" type="text" class="form-control" placeholder="Enter full name">
                </div>
                <div class="col-md-6">
                  <label class="form-label">ABHA Id</label>
                  <input id="patiendAbhId" type="text" class="form-control" placeholder="Enter ABHA id">
                </div>
                <div class="col-sm-2">
                  <label class="form-label">Mobile</label>
                  <select id="patiendMobNumberCode" class="form-select">
                    <option value="0">+91</option>
                    <option value="1">+123</option>
                    <option value="0">+01</option>
                    <option value="1">+77</option>
                    <option value="1">+57</option>
                  </select>
                </div>
                <div class="col-sm-10">
                  <label class="form-label res-d-none">&nbsp;</label>
                  <input id="patiendMobNumber" type="number" class="form-control" placeholder="Enter Mobile Number">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Gender</label>
                  <select id="patiendGender" class="form-select">
                    <option value="0">Male</option>
                    <option value="1">Female</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Age</label>
                  <input id="patiendAge" type="number" class="form-control" placeholder="Enter Age">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Appointment Date</label>
                  <input id="patientDate" type="date" class="form-control">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Time Slot</label>
                  <div class="time-slot-grid" id="patientTimeSlot">
                    <div class="time-slot-card">09:00 AM</div>
                    <div class="time-slot-card">09:30 AM</div>
                    <div class="time-slot-card">10:00 AM</div>
                    <div class="time-slot-card">10:30 AM</div>
                    <div class="time-slot-card">11:00 AM</div>
                    <div class="time-slot-card">11:30 AM</div>
                  </div>
                </div>
                <div class="col-md-12">
                  <label class="form-label">Symptoms / Notes</label>
                  <textarea id="patiendSymptoms" class="form-control" rows="4" placeholder="Enter symptoms"></textarea>
                </div>
                <div class="col-xl-6 col-lg-8 col-">
                  <label class="form-label">Upload File</label>
                  <div class="d-flex align-items-center flex-wrap">
                    <input type="file" id="patiendUpload" class="form-control up-ip">
                    <label for="patiendUpload" class="btn btn-brand up-btn"><i class="bi bi-upload"></i> Upload File</label>
                  </div>
                </div>
                
                <div class="col-md-12 mt-4 text-center">
                  <button type="submit" class="btn btn-brand w-50" onclick="">
                    Register
                  </button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>

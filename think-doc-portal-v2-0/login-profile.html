<body>

  <!----------------------------------- PRE-LOADER ------------------------------------------------->
  <div id="PreLoader" class="pre-loader fixed top-0 left-0 size-full flex items-center justify-center bg-[var(--light)] z-100">
    <div class="pg-loader flex gap-2 px-4 py-1 border border-solid border-[#e8e8e8] rounded-2xl bg-[#ffffffe6] drop-shadow-xl">
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
      <span class="h-2 w-2 rounded-2xl bg-[var(--primary)]"></span>
    </div>
  </div>
  <!----------------------------------- PRE-LOADER ------------------------------------------------->

  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->
  <div class="h-screen w-full bg-linear-to-t from-[#EDF6FF] to-[var(--light)]">

    <!----- PROFILE-SELETION-VERFICATION ------->
    <div class="size-full flex flex-col items-center justify-center fixed top-0 left-0">

      <div class="h-auto w-40 mb-[45px] min-[576px]:w-50">
        <img src="assets/images/thinklab-logo.png" alt="brand logo">
      </div>

      <div class="h-auto w-80 min-[576px]:w-120">
        <h5 class="text-[130%] font-medium text-[var(--dark-primary)]/90 text-center mb-8 min-[576px]:text-[150%]">Welcome Doctor!</h5>

        <div class="h-auto w-full mb-8">
          <label class="inline-block font-medium">Select Profile</label>

          <div class="dropdown w-full relative z-1">
            <button class="btn dropdown-toggle h-auto w-full bg-[var(--light)] border border-solid border-[#d1d1d19e] rounded-[5px] px-5 py-3 text-[80%] text-[var(--dark-primary)]/50 font-medium hover:border-[var(--primary)] focus:border-[var(--primary)] focus:ring-2 focus:ring-[var(--primary)]/20 outline-none bg-white text-left flex items-center justify-between min-[576px]:text-[95%]" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="DoctorProfileSelect">
              <span>Select Doctor Profile</span>
              <svg id="DoctorChevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="transition-all duration-300">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <ul class="dropdown-menu w-full absolute top[100%] left-0 z-2 p-2 rounded-xl border border-[#d1d1d19e] bg-white overflow-hidden hidden" id="DoctorDropdown">

              <li class="mb-2 last:mb-0">
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <input type="checkbox" class="h-4 w-4 accent-[var(--primary)] shrink-0" value="1" checked />

                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[90%] font-semibold text-[var(--dark-primary)]">
                      Dr. Priya Saha
                      <span class="block mt-1 text-[78%] font-medium text-[var(--dark-primary)]/55">
                        Branch Elgin Road
                      </span>
                    </p>
                  </div>

                  <em class="not-italic rounded-[100px] bg-red-600/10 px-3 py-1 text-[70%] font-bold text-red-600/80">
                    Withdraw
                  </em>
                </label>
              </li>

              <li class="mb-2 last:mb-0">
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <input type="checkbox" class="h-4 w-4 accent-[var(--primary)] shrink-0" value="1" />

                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[90%] font-semibold text-[var(--dark-primary)]">
                      Dr. Priya Saha
                      <span class="block mt-1 text-[78%] font-medium text-[var(--dark-primary)]/55">
                        Shibpur Branch
                      </span>
                    </p>
                  </div>
                </label>
              </li>

              <li class="mb-0">
                <label class="dropdown-item flex items-center gap-3 rounded-[5px] px-4 py-2 hover:bg-[var(--primary)]/10 cursor-pointer transition-all duration-300">
                  <input type="checkbox" class="h-4 w-4 accent-[var(--primary)] shrink-0" value="1" checked />

                  <div class="flex-1 leading-tight">
                    <p class="m-0 text-[90%] font-semibold text-[var(--dark-primary)]">
                      Dr. Priya Saha
                      <span class="block mt-1 text-[78%] font-medium text-[var(--dark-primary)]/55">
                        HO
                      </span>
                    </p>
                  </div>

                  <em class="not-italic rounded-[100px] bg-red-600/10 px-3 py-1 text-[70%] font-bold text-red-600/80">
                    Withdraw
                  </em>
                </label>
              </li>

            </ul>
          </div>
          
        </div>

        <div class="h-auto w-full text-center">
          <button class="h-auto w-40 rounded-md py-3 text-[90%] text-[var(--light)] font-medium bg-[var(--primary)] border-none outline-none shadow-[0_20px_20px_0_#0b28a824] min-[576px]:w-45 min-[576px]:text-[95%]" onclick="window.location.href='index.html'">
            Login Now
          </button>       
        </div>
      </div>

    </div>
    <!----- PROFILE-SELETION-VERFICATION ------->

  </div>
  <!----------------------------------- LOG-IN SECTION ------------------------------------------------->

  <!----------------------------------- JS FOR CUSTOM-SELECT START ------------------------------------------------->
  <script>
    const doctorBtn = document.getElementById("DoctorProfileSelect");
    const doctorDropdown = document.getElementById("DoctorDropdown");
    const doctorChevron = document.getElementById("DoctorChevron");

    doctorBtn.addEventListener("click", function (e) {

        e.stopPropagation();

        doctorDropdown.classList.toggle("hidden");

        doctorChevron.classList.toggle("rotate-180");
    });

    document.addEventListener("click", function (e) {

        if (
            !doctorBtn.contains(e.target) &&
            !doctorDropdown.contains(e.target)
        ) {
            doctorDropdown.classList.add("hidden");
            doctorChevron.classList.remove("rotate-180");
        }
    });
  </script>
  <!----------------------------------- JS FOR CUSTOM-SELECT COMPLETED ------------------------------------------------->

  <!----------------------------------- JS FOR TAILWIND FILES START ------------------------------------------------->
  <script src="assets/js/tailwind.js" type="text/javascript"></script>
  <!------------------------------------- JS FOR TAILWIND FILES COMPLETED ------------------------------------------->

  <!------------------------------------ JS FOR MAIN FILES START -------------------------------------------->
  <script src="assets/js/main.js" type="text/javascript"></script>
  <!----------------------------------------- JS FOR MAIN FILES COMPLETE ---------------------------------------->

</body>
</html>
